<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Premium Movies</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #151515;
            padding: 20px;
            border-bottom: 2px solid red;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            color: red;
        }

        header button {
            padding: 10px 18px;
            background: red;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .hero {
            padding: 50px 20px;
            text-align: center;
            background: linear-gradient(#300000, #0b0b0b);
        }

        .hero h2 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .search {
            margin-top: 25px;
            padding: 12px;
            width: min(90%, 450px);
            border: 1px solid red;
            border-radius: 5px;
            background: #222;
            color: white;
        }

        .movies {
            padding: 25px 20px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .movie {
            background: #191919;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .poster {
            height: 190px;
            background: linear-gradient(135deg, #450000, #111);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
        }

        .movie h3 {
            padding: 12px;
            font-size: 16px;
        }

        .movie p {
            padding: 0 12px 15px;
            color: #bbb;
            font-size: 13px;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 30px;
            background: #151515;
            border-top: 2px solid red;
            color: #aaa;
        }

        footer strong {
            color: red;
        }
    </style>
</head>

<body>

    <header>
        <h1>PREMIUM MOVIES</h1>
        <button onclick="alert('Login feature coming soon!')">
            Login / Register
        </button>
    </header>

    <section class="hero">
        <h2>Discover Your Next Movie</h2>
        <p>Explore movies and watch your favourites.</p>

        <input
            type="search"
            id="search"
            class="search"
            placeholder="Search movies..."
            oninput="searchMovies()"
        >
    </section>

    <section class="movies">
        <h2>🎬 Explore Movies</h2>

        <div class="movie-grid" id="movieGrid">

            <div class="movie" data-title="Sample Movie">
                <div class="poster">🎬</div>
                <h3>Sample Movie</h3>
                <p>Movie details will appear here.</p>
            </div>

            <div class="movie" data-title="Action Movie">
                <div class="poster">🍿</div>
                <h3>Action Movie</h3>
                <p>Movie details will appear here.</p>
            </div>

            <div class="movie" data-title="Drama Movie">
                <div class="poster">🎥</div>
                <h3>Drama Movie</h3>
                <p>Movie details will appear here.</p>
            </div>

        </div>
    </section>

    <footer>
        <p>Website Developed by <strong>Jayantha Dilan</strong></p>
    </footer>

    <script>
        function searchMovies() {
            const query = document
                .getElementById("search")
                .value.toLowerCase();

            document.querySelectorAll(".movie").forEach(movie => {
                const title = movie.dataset.title.toLowerCase();
                movie.style.display = title.includes(query)
                    ? ""
                    : "none";
            });
        }
    </script>

</body>
  </html>
